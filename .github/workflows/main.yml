name: Validar y eliminar deploy

on:
  push:
    branches: ["main"]

permission:
    contents: read 


jobs:
  validar:
    runs-on: ubuntu-lastest
    steps:
      - name: preparar repositorio
        uses: actions/checkout@v4
      - name: "PASO 1 estructura de carpetas"
        uses: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml
         
      - name: "construccion"
        uses: docker compose build
