name: Validar y eliminar deploy

on:
  push:
    branches: ["main"]

permissions:
    contents: read 


jobs:
  validar:
    runs-on: ubuntu-lastest
    steps:
      - name: "preparar repositorio"
        uses: actions/checkout@v4

      - name: "PASO 1 estructura de carpetas"
        run: |
          test -d app
          test -f app/index.php
          test -f Dockerfile
          test -f docker-compose.yml
         
      - name: "construccion"
        run: docker compose build
